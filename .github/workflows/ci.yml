on:
    pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Docker image
        run: docker build -t cicd-from-scratch:${{ github.sha }} .

      - name: Save Docker image to tar archive
        run: |
          mkdir -p image-artifacts
          docker save cicd-from-scratch:${{ github.sha }} -o image-artifacts/cicd-from-scratch_${{ github.sha }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image
          path: image-artifacts/cicd-from-scratch_${{ github.sha }}.tar
          retention-days: 1