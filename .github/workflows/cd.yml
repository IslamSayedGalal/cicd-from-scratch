name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  push-to-dockerhub:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-image
          path: image-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load Docker image from artifact
        run: docker load -i image-artifacts/cicd-from-scratch.tar

      - name: Log in to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker tag cicd-from-scratch:${IMAGE_SHA} ${DOCKER_USERNAME}/cicd-from-scratch:latest
          docker tag cicd-from-scratch:${IMAGE_SHA} ${DOCKER_USERNAME}/cicd-from-scratch:${IMAGE_SHA}
          docker push ${DOCKER_USERNAME}/cicd-from-scratch:latest
          docker push ${DOCKER_USERNAME}/cicd-from-scratch:${IMAGE_SHA}
