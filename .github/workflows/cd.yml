on:
    push:
      branches:
        - main

jobs:
    push-to-dockerhub:
        runs-on: ubuntu-latest
        steps:
            - name: Download Docker image artifact
              uses: actions/download-artifact@v8.0.1
              with:
                name: docker-image
                path: image-artifacts

            - name: Load Docker image from tar archive
              run: docker load -i image-artifacts/cicd-from-scratch_${{ github.sha }}.tar

            - name: Log in to DockerHub
              uses: docker/login-action@v4.6.0
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7.3.0
              with:
                context: .
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/cicd-from-scratch:latest
                    ${{ secrets.DOCKER_USERNAME }}/cicd-from-scratch:${{ github.sha }}
